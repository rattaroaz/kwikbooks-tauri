name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      # Snapshot baselines are Windows-only (see tests/e2e/*-snapshots); full functional E2E runs here.
      - run: npm run test:e2e:ci
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-ubuntu
          path: test-results/
          retention-days: 5

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tauri links against WebKitGTK on Linux; Ubuntu runners do not include these by default.
      - name: Install Linux dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test
        working-directory: src-tauri

  tauri_smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx playwright install chromium firefox
      - run: npm run test:e2e -- tests/e2e/visual-a11y.spec.ts
      - run: npm run tauri:build -- --debug --no-bundle
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-windows-visual
          path: test-results/
          retention-days: 5
