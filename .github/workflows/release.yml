name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.9.0)"
        required: true
        default: "v0.9.0"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - name: Enable VBScript (WiX / MSI on Windows runner)
        shell: pwsh
        run: |
          # Windows 11 24H2+ (GitHub windows-latest): VBSCRIPT is a Feature on Demand
          # (capability), not a legacy optional feature — enable-feature fails with 0x800f080c.
          $cap = Get-WindowsCapability -Online | Where-Object { $_.Name -like 'VBSCRIPT*' } | Select-Object -First 1
          if ($cap) {
            if ($cap.State -eq 'Installed') {
              Write-Host "$($cap.Name) already installed."
            } else {
              Write-Host "Installing $($cap.Name) (state was $($cap.State))..."
              Add-WindowsCapability -Online -Name $cap.Name | Out-String | Write-Host
            }
          } else {
            Write-Host 'VBSCRIPT capability not found; trying legacy DISM feature enable...'
            dism /online /enable-feature /featurename:VBSCRIPT /all /norestart
            if ($LASTEXITCODE -ne 0 -and -not (Test-Path "$env:Windir\System32\vbscript.dll")) {
              throw "VBSCRIPT is required for MSI builds but could not be enabled (exit $LASTEXITCODE)."
            }
          }
          if (-not (Test-Path "$env:Windir\System32\vbscript.dll")) {
            throw 'VBSCRIPT is required for MSI builds (vbscript.dll missing after install step).'
          }
          Write-Host 'VBScript ready for WiX MSI build.'

      - name: Normalize signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "TAURI_SIGNING_PRIVATE_KEY secret is not set" }
          $key = $env:TAURI_SIGNING_PRIVATE_KEY.Trim()
          $password = if ($null -eq $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { "" } else { $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD.Trim() }
          @(
            "TAURI_SIGNING_PRIVATE_KEY<<EOF",
            $key,
            "EOF",
            "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<EOF",
            $password,
            "EOF"
          ) | Add-Content -Path $env:GITHUB_ENV -Encoding utf8

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "Kwikbooks ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis,msi
